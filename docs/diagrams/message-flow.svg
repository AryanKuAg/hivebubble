        <line x1="636" y1="240" x2="128" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow-open)"/>
        <line x1="644" y1="276" x2="892" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#message-flow-arrow)"/>
        <line x1="900" y1="356" x2="1148" y2="356" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#message-flow-arrow-link)"/>
        <line x1="1148" y1="388" x2="900" y2="388" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow)"/>
        <line x1="892" y1="424" x2="388" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow-open)"/>
        <line x1="892" y1="460" x2="128" y2="460" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow-open)"/>
        <line x1="380" y1="496" x2="128" y2="496" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow-open)"/>
        <line x1="892" y1="556" x2="644" y2="556" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#message-flow-arrow)"/>
        <line x1="636" y1="592" x2="128" y2="592" stroke="#bf4520" stroke-width="1.4" marker-end="url(#message-flow-arrow-accent)"/>
        <!-- Message labels -->
        <rect x="216" y="132" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ASK + ELEMENT</text>
